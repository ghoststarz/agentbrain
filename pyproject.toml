[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentbrain"
version = "0.1.0"
description = "Cross-client local memory broker: Markdown source of truth, rebuildable SQLite FTS5 index, budgeted injection"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "mcp>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.urls]
Homepage = "https://github.com/ghoststarz/agentbrain"
Issues = "https://github.com/ghoststarz/agentbrain/issues"

[project.scripts]
agentbrain = "agentbrain.cli:main"

[tool.setuptools.packages.find]
include = ["agentbrain*"]
